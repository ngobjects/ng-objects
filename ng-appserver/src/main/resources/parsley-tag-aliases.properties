# ng-objects' tag registry: the tag names templates may use for the framework's elements.
#
# Each entry is  tagName = element  where the element is the simple class name of a
# registered element class (see NGCorePlugin.elements()). This file is the single source
# of truth for those names: the runtime (NGElementManager) loads every copy of this
# resource on the classpath, and the Parsley template editor reads the same files
# statically — so what a template tag resolves to is identical in the app and in the IDE,
# and never has to be guessed from the WebObjects element names.
#
# Resolution is recursive (an alias may point at another alias) and first-declaration-wins:
# if two files on the classpath map the same tag to different targets, the later one is
# ignored with a warning. Frameworks and applications add their own tags by shipping a file
# of the same name in their own src/main/resources.

# --- Core elements ---
actionURL = NGActionURL
browser = NGBrowser
checkbox = NGCheckbox
container = NGGenericContainer
content = NGComponentContent
element = NGGenericElement
fileUpload = NGFileUpload
form = NGForm
if = NGConditional
img = NGImage
link = NGHyperlink
password = NGPasswordField
popUpButton = NGPopUpButton
repetition = NGRepetition
resourceURL = NGResourceURL
script = NGJavaScript
str = NGString
stylesheet = NGStylesheet
submit = NGSubmitButton
switch = NGSwitchComponent
text = NGText
textfield = NGTextField

# --- Ajax elements ---
aof = AjaxObserveField
asb = AjaxSubmitButton
auc = AjaxUpdateContainer
aul = AjaxUpdateLink
