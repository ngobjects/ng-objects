# The tags templates use for ng-appserver's elements: tagName = element, where the element is
# an element's name (or another tag). A namespace's tags live in its folder
# (ng/<namespace>/tag-aliases.properties) and are loaded in plugin order, so a plugin or the
# application can rename or redirect a tag here by mapping it again in its own namespace.
#
# Resolution is recursive: an alias may point at another alias.

# --- Core elements ---
actionURL = NGActionURL
browser = NGBrowser
checkbox = NGCheckbox
container = NGGenericContainer
content = NGComponentContent
element = NGGenericElement
fileUpload = NGFileUpload
form = NGForm
if = NGConditional
img = NGImage
link = NGHyperlink
password = NGPasswordField
popUpButton = NGPopUpButton
repetition = NGRepetition
resourceURL = NGResourceURL
script = NGJavaScript
str = NGString
stylesheet = NGStylesheet
submit = NGSubmitButton
switch = NGSwitchComponent
text = NGText
textfield = NGTextField

# --- Ajax elements ---
aof = AjaxObserveField
asb = AjaxSubmitButton
auc = AjaxUpdateContainer
aul = AjaxUpdateLink
